<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason's SAT & Top 20 Roadmap</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2563eb; --secondary: #1e40af; --accent: #ffd700; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: var(--secondary); }
        .score-display { text-align: center; font-size: 3rem; font-weight: 800; margin: 20px 0; color: var(--primary); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--secondary); }
        .predictor-section { margin-top: 40px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
        .card { background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .input-group { margin: 10px 0; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        #result-display { text-align: center; padding: 20px; border-radius: 15px; margin-top: 20px; display: none; }
        .rank-chosen { background: linear-gradient(135deg, #ffd700, #f59e0b); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>SAT & University Roadmap</h1>
    
    <div class="score-display" id="sat-score">1400</div>
    <canvas id="scoreChart" width="400" height="200"></canvas>
    
    <div style="margin-top:20px;">
        <button class="btn btn-primary" onclick="updateDaily(4)">SAT Prep Completed (+4)</button>
        <button class="btn" style="background:#ef4444; color:white;" onclick="updateDaily(-4)">Forgot Daily Routine (-4)</button>
    </div>

    <div class="predictor-section">
        <h2>🏛️ Top 20 Predictor</h2>
        <p style="text-align:center; font-size:0.9rem; color:#64748b;">Calculate your chance for Ivy League & Top 20s</p>
        
        <div class="card">
            <label>GPA (Unweighted)</label>
            <select id="gpa">
                <option value="20">3.9 or Higher (+20)</option>
                <option value="15">3.7 - 3.89 (+15)</option>
                <option value="0">Below 3.7 (+0)</option>
            </select>
        </div>

        <div class="card">
            <label>Number of AP/Honors Courses</label>
            <input type="number" id="ap-count" placeholder="Enter number of courses" onchange="calculateScore()">
        </div>

        <div class="card">
            <label>SoundBuddy (Passion Project)</label>
            <select id="project">
                <option value="50">National Award / Launch (+50)</option>
                <option value="35">State Level Award (+35)</option>
                <option value="20">Regional Award / MVP (+20)</option>
                <option value="10">Development Started (+10)</option>
            </select>
        </div>

        <div class="card">
            <label>Jazz Band & Art</label>
            <select id="jazz">
                <option value="30">National Level Honors (+30)</option>
                <option value="10">State Level Honors (+10)</option>
                <option value="5">District / School Level (+5)</option>
            </select>
        </div>

        <div class="card">
            <label>Personal Essay (Story)</label>
            <select id="essay">
                <option value="40">Masterpiece: Emotional & Humorous (+40)</option>
                <option value="20">Strong Personal Story (+20)</option>
                <option value="5">Standard Application Essay (+5)</option>
            </select>
        </div>

        <div class="card">
            <label>Expert Recommendations</label>
            <select id="recs">
                <option value="30">3+ High-Impact Mentors (+30)</option>
                <option value="15">2 Strong Mentors (+15)</option>
                <option value="10">1 Strong Mentor (+10)</option>
            </select>
        </div>

        <button class="btn" style="background:#1e293b; color:white;" onclick="calculateScore()">Analyze My Chances</button>

        <div id="result-display">
            <h3 id="res-score">Total Score: 0</h3>
            <h2 id="res-rank">RANK</h2>
            <p id="res-msg"></p>
        </div>
    </div>
</div>

<script>
    let scores = JSON.parse(localStorage.getItem('satHistory')) || [1400];
    let currentScore = scores[scores.length - 1];

    function updateDaily(points) {
        currentScore += points;
        scores.push(currentScore);
        if(scores.length > 30) scores.shift();
        localStorage.setItem('satHistory', JSON.stringify(scores));
        renderUI();
    }

    function calculateScore() {
        let total = 0;
        
        // 1. SAT Auto-sync
        if (currentScore >= 1550) total += 20;
        else if (currentScore >= 1500) total += 15;

        // 2. Academic & Projects
        total += parseInt(document.getElementById('gpa').value);
        total += (parseInt(document.getElementById('ap-count').value) || 0) * 2.5;
        total += parseInt(document.getElementById('project').value);
        total += parseInt(document.getElementById('jazz').value);
        total += parseInt(document.getElementById('essay').value);
        total += parseInt(document.getElementById('recs').value);

        showFinalResult(total);
    }

    function showFinalResult(score) {
        const display = document.getElementById('result-display');
        const resRank = document.getElementById('res-rank');
        const resMsg = document.getElementById('res-msg');
        const resScore = document.getElementById('res-score');
        
        display.style.display = "block";
        resScore.innerText = `Total Admission Score: ${score}`;

        if (score >= 180) {
            display.className = "rank-chosen";
            resRank.innerText = "THE CHOSEN ONE";
            resMsg.innerText = "You are a top-tier candidate. UPenn and Ivy Leagues are within your reach.";
        } else if (score >= 150) {
            display.className = "card";
            resRank.innerText = "IVY LEAGUE TIER";
            resMsg.innerText = "Highly competitive. One more 'National' hook will secure your spot.";
        } else if (score >= 100) {
            display.className = "card";
            resRank.innerText = "COMPETITIVE BLUE";
            resMsg.innerText = "Solid standing. Strengthen your Passion Project to stand out.";
        } else {
            display.className = "card";
            resRank.innerText = "THE GROUNDWORK";
            resMsg.innerText = "Focus on hitting 1550+ SAT and 3.9+ GPA first.";
        }
    }

    function renderUI() {
        document.getElementById('sat-score').innerText = currentScore;
        chart.update();
    }

    const ctx = document.getElementById('scoreChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: scores.map((_, i) => `Day ${i+1}`),
            datasets: [{
                label: 'Estimated SAT Score',
                data: scores,
                borderColor: '#2563eb',
                tension: 0.3,
                fill: true,
                backgroundColor: 'rgba(37, 99, 235, 0.1)'
            }]
        },
        options: { scales: { y: { min: 1300, max: 1600 } } }
    });

    renderUI();
</script>

</body>
</html>
