<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason's Victory Roadmap v1.4.3</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .app-container { width: 100%; max-width: 450px; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; margin-bottom: 20px; }
        .header { color: #888; font-size: 0.9rem; margin-bottom: 10px; }
        .score-value { font-size: 5rem; font-weight: 800; color: #1a73e8; margin: 5px 0; letter-spacing: -2px; }
        .btn { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #1a73e8; color: white; }
        .btn-secondary { background-color: #f8f9fa; color: #5f6368; border: 1px solid #dadce0; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
        .choice-btn-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .choice-btn { flex: 1; padding: 15px; border: 1px solid #dadce0; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; }
        .btn-yes { background-color: #1a73e8; color: white; border: none; }
        .input-set { width: 100%; padding: 12px; margin-top: 15px; border-radius: 10px; border: 2px solid #1a73e8; font-size: 1.2rem; text-align: center; outline: none; }
        .reset-link { margin-top: 30px; font-size: 0.65rem; color: #eee; cursor: pointer; text-decoration: underline; border: none; background: none; }
        .reset-link:hover { color: #ccc; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="display-date">Loading...</div>
    <div style="font-size: 1.1rem; color: #444;">Mason's SAT Level 🚀</div>
    <div id="sat-score" class="score-value">----</div>
    
    <button class="btn btn-primary" onclick="startPrep()">SAT Prep Start</button>
    <button class="btn btn-secondary" onclick="toggleHistory()">Growth History</button>

    <div id="history-section" style="display:none; margin-top:20px; width:100%;">
        <canvas id="scoreChart"></canvas>
    </div>

    <button class="reset-link" onclick="forceReset()">Admin: Reset to 1420</button>
</div>

<div id="prepModal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title" style="color: #1a73e8; margin-top: 0;">Step 1</h2>
        <p id="question-display" style="font-size: 1.1rem; line-height: 1.4;"></p>
        
        <div id="binary-choice" class="choice-btn-group">
            <button class="choice-btn btn-yes" onclick="handleBinary(true)">Yes! 🎉</button>
            <button class="choice-btn" onclick="handleBinary(false)">No</button>
        </div>

        <div id="number-choice" style="display:none;">
            <input type="number" id="set-count" class="input-set" placeholder="How many?">
            <button class="btn btn-primary" style="margin-top:15px;" onclick="handleNumber()">Next</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAoLonGkvQrPpNk5Rl8vJvR-eNg63xUPO4",
        authDomain: "road-to-the-victory-mason.firebaseapp.com",
        projectId: "road-to-the-victory-mason",
        storageBucket: "road-to-the-victory-mason.firebasestorage.app",
        messagingSenderId: "501843531403",
        appId: "1:501843531403:web:da9adcba51b12ad057e68e",
        databaseURL: "https://road-to-the-victory-mason-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = { score: 1420, lastUpdateDay: new Date().toDateString(), didCheckIn: false, history: [] };
    let currentStep = 0;
    let sessionPoints = 0;

    const flow = [
        { q: "Did you do Mastery Challenge for Math? ✏️", type: "binary", points: 1 },
        { q: "How many Math sets did you do today? 🔢", type: "number" },
        { q: "Did you do Mastery Challenge for Reading/Writing? 📚", type: "binary", points: 1 },
        { q: "How many R&W sets did you do today? 🔢", type: "number" }
    ];

    async function loadData() {
        const snapshot = await db.ref('mason_sat_data').once('value');
        if (snapshot.exists()) {
            state = snapshot.val();
            checkDailyGap();
        } else {
            forceReset(); // 데이터 없으면 1420으로 시작
        }
        updateUI();
    }

    function checkDailyGap() {
        const todayStr = new Date().toDateString();
        if (todayStr !== state.lastUpdateDay) {
            const lastDate = new Date(state.lastUpdateDay);
            const diffDays = Math.floor(Math.abs(new Date(todayStr) - lastDate) / (1000 * 60 * 60 * 24));
            
            if (diffDays >= 1) {
                // 어제 체크인을 안했다면 무조건 5점 감점
                let penaltyStart = state.didCheckIn ? 1 : 0;
                for(let i = penaltyStart; i < diffDays; i++) {
                    state.score -= 5; // 5점 감점으로 변경
                    let mDate = new Date(lastDate); mDate.setDate(lastDate.getDate() + i + 1);
                    state.history.push({ date: mDate.toLocaleDateString('en-US', {month:'short', day:'numeric'}), score: state.score });
                }
            }
            state.lastUpdateDay = todayStr;
            state.didCheckIn = false;
            saveData();
        }
    }

    function startPrep() {
        if (state.didCheckIn) return alert("All set for today! ✨");
        currentStep = 0; sessionPoints = 0;
        showStep();
        document.getElementById('prepModal').style.display = 'flex';
    }

    function showStep() {
        const item = flow[currentStep];
        document.getElementById('question-display').innerText = item.q;
        if (item.type === "binary") {
            document.getElementById('binary-choice').style.display = 'flex';
            document.getElementById('number-choice').style.display = 'none';
        } else {
            document.getElementById('binary-choice').style.display = 'none';
            document.getElementById('number-choice').style.display = 'block';
            document.getElementById('set-count').value = "";
            document.getElementById('set-count').focus();
        }
    }

    function handleBinary(isYes) {
        if (isYes) sessionPoints += flow[currentStep].points;
        nextStep();
    }

    function handleNumber() {
        const val = parseInt(document.getElementById('set-count').value) || 0;
        sessionPoints += val; // 1세트당 1점
        nextStep();
    }

    function nextStep() {
        currentStep++;
        if (currentStep < flow.length) showStep();
        else finishSession();
    }

    function finishSession() {
        state.score += sessionPoints;
        state.didCheckIn = true;
        state.history.push({ date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}), score: state.score });
        saveData();
        document.getElementById('prepModal').style.display = 'none';
        alert(`Excellent work! +${sessionPoints} points added.`);
    }

    function forceReset() {
        if(!confirm("정말로 1420점으로 초기화하시겠습니까? 테스트 데이터가 모두 삭제됩니다.")) return;
        state = {
            score: 1420,
            lastUpdateDay: new Date().toDateString(),
            didCheckIn: false,
            history: [{date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}), score: 1420}]
        };
        saveData();
    }

    function saveData() {
        db.ref('mason_sat_data').set(state);
        updateUI();
    }

    function updateUI() {
        document.getElementById('sat-score').innerText = state.score;
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function toggleHistory() {
        const s = document.getElementById('history-section');
        s.style.display = (s.style.display === 'none') ? 'block' : 'none';
    }

    window.onload = loadData;
</script>
</body>
</html>
