<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT 1500 Tracker - Mason Edition</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header { text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .score-section { text-align: center; margin-bottom: 30px; }
        .score-label { font-size: 1rem; color: #888; }
        .score-value { font-size: 4rem; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .score-change { font-size: 1.2rem; font-weight: bold; }
        .up { color: #27ae60; } .down { color: #e74c3c; }
        
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-secondary { background-color: #ecf0f1; color: #7f8c8d; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 80%; max-width: 300px; }
        .question { margin-bottom: 20px; }
        .history-list { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; font-size: 0.8rem; color: #777; }
        .sim-info { background: #fff3cd; padding: 5px; font-size: 0.7rem; border-radius: 5px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sim-info">🛠 Simulation Mode: 1 Minute = 1 Day</div>
    <div class="header" id="current-date">March 22, 2026</div>
    
    <div class="score-section">
        <div class="score-label">Your Current Estimated SAT</div>
        <div class="score-value" id="sat-score">1400</div>
        <div class="score-change" id="score-trend">--</div>
    </div>

    <button class="btn btn-primary" onclick="openPrep()">SAT Prep Start</button>
    <button class="btn btn-secondary" onclick="alert('Graph feature coming soon!')">History & Trends</button>

    <div class="history-list" id="history-log">
        <strong>History (Recent)</strong>
        <div id="log-items"></div>
    </div>
</div>

<div id="prepModal" class="modal">
    <div class="modal-content">
        <h3 id="subject-title">Math Section</h3>
        <div id="q1-area" class="question">
            <p id="q1-text">Did you finish Khan Academy?</p>
            <button onclick="handleAnswer(true)">Yes</button>
            <button onclick="handleAnswer(false)">No</button>
        </div>
        <div id="q2-area" class="question" style="display:none;">
            <p id="q2-text">Did you finish Error Note?</p>
            <button onclick="handleAnswer(true)">Yes</button>
            <button onclick="handleAnswer(false)">No</button>
        </div>
    </div>
</div>

<script>
    // --- App Logic ---
    let currentSAT = 1400;
    let lastSAT = 1400;
    let lastUpdateMinute = new Date().getMinutes();
    let didCheckInThisMinute = false;
    
    let currentStep = 1; // 1: Math Q1, 2: Math Q2, 3: ELA Q1, 4: ELA Q2
    let tempEarnedPoints = 0;

    function updateUI() {
        document.getElementById('sat-score').innerText = currentSAT;
        const trend = document.getElementById('score-trend');
        const diff = currentSAT - lastSAT;
        
        if (diff > 0) {
            trend.innerText = `▲ ${diff} pts from yesterday`;
            trend.className = "score-change up";
        } else if (diff < 0) {
            trend.innerText = `▼ ${Math.abs(diff)} pts from yesterday`;
            trend.className = "score-change down";
        } else {
            trend.innerText = "--";
            trend.className = "score-change";
        }
    }

    // --- Time Simulation Engine ---
    setInterval(() => {
        let now = new Date();
        let currentMinute = now.getMinutes();

        // If a "New Day" (New Minute) starts
        if (currentMinute !== lastUpdateMinute) {
            if (!didCheckInThisMinute) {
                lastSAT = currentSAT;
                currentSAT -= 4; // Penalty
                addLog("Missed Check-in", -4);
                updateUI();
            }
            lastUpdateMinute = currentMinute;
            didCheckInThisMinute = false;
            console.log("New Simulation Day Started...");
        }
    }, 1000);

    function addLog(activity, change) {
        const log = document.getElementById('log-items');
        const item = document.createElement('div');
        item.innerText = `${new Date().toLocaleTimeString()} | ${activity} (${change > 0 ? '+' : ''}${change})`;
        log.prepend(item);
    }

    // --- SAT Prep Flow ---
    function openPrep() {
        if(didCheckInThisMinute) return alert("Already submitted for today!");
        currentStep = 1;
        tempEarnedPoints = 0;
        showStep();
        document.getElementById('prepModal').style.display = 'flex';
    }

    function showStep() {
        const q1Area = document.getElementById('q1-area');
        const q2Area = document.getElementById('q2-area');
        const title = document.getElementById('subject-title');
        const q1Text = document.getElementById('q1-text');
        const q2Text = document.getElementById('q2-text');

        q2Area.style.display = 'none';
        q1Area.style.display = 'block';

        if (currentStep <= 2) {
            title.innerText = "Math Section";
            q1Text.innerText = "Did you complete Khan Academy Math?";
            q2Text.innerText = "Did you finish Math Error Note?";
        } else {
            title.innerText = "ELA Section";
            q1Text.innerText = "Did you complete Khan Academy ELA?";
            q2Text.innerText = "Did you finish ELA Error Note?";
        }
    }

    function handleAnswer(isYes) {
        if (currentStep === 1 || currentStep === 3) { // Q1 (Completion)
            if (isYes) {
                tempEarnedPoints += 1;
                currentStep++; // Go to Q2 (Error Note)
                document.getElementById('q1-area').style.display = 'none';
                document.getElementById('q2-area').style.display = 'block';
            } else {
                currentStep += 2; // Skip to next subject's Q1
                if (currentStep > 4) finishPrep();
                else showStep();
            }
        } else { // Q2 (Error Note)
            if (isYes) tempEarnedPoints += 1;
            currentStep++; 
            if (currentStep > 4) finishPrep();
            else showStep();
        }
    }

    function finishPrep() {
        lastSAT = currentSAT;
        currentSAT += tempEarnedPoints;
        didCheckInThisMinute = true;
        addLog("Completed SAT Prep", tempEarnedPoints);
        updateUI();
        document.getElementById('prepModal').style.display = 'none';
    }
</script>

</body>
</html>
