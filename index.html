<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mason's Victory Roadmap v1.5.3</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 15px; margin: 0; }
        .app-container { width: 100%; max-width: 420px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .score-value { font-size: 5rem; font-weight: 900; color: #1a73e8; margin: 5px 0; letter-spacing: -2px; line-height: 1; }
        .btn { width: 100%; padding: 18px; margin: 8px 0; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #1a73e8; color: white; }
        .btn-secondary { background-color: #e8f0fe; color: #1a73e8; }
        .chance-value { font-size: 3.5rem; font-weight: 800; color: #34a853; line-height: 1; }
        .check-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f1f1; text-align: left; }
        input[type="checkbox"] { width: 22px; height: 22px; margin-right: 12px; accent-color: #1a73e8; }
        .check-label { font-size: 0.9rem; color: #333; flex: 1; font-weight: 500; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .modal-content { background: white; padding: 30px; border-radius: 25px; width: 85%; max-width: 300px; text-align: center; }
        .input-set { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 2px solid #1a73e8; font-size: 1.2rem; text-align: center; box-sizing: border-box; }
        #chartContainer { width: 100%; height: 250px; margin-top: 10px; display: none; }
        .reset-btn { font-size: 0.7rem; color: #bbb; cursor: pointer; background: none; border: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="card">
        <div style="font-size: 0.8rem; color: #888;" id="display-date">Loading...</div>
        <div style="font-size: 1rem; font-weight: 600; color: #444; margin-top: 5px;">Mason's SAT Level 🚀</div>
        <div id="sat-score" class="score-value">----</div>
        <button class="btn btn-primary" onclick="startPrep()">SAT Prep Start</button>
        <button class="btn btn-secondary" style="font-size: 0.9rem; padding: 12px;" onclick="toggleGraph()">📊 View Performance Graph</button>
        <div id="chartContainer"><canvas id="scoreChart"></canvas></div>
    </div>

    <div class="card">
        <div style="font-size: 0.9rem; color: #5f6368; font-weight: 600;">Top-Tier Admission Chance</div>
        <div id="chance-percent" class="chance-value">--%</div>
        <div id="chance-level" style="font-size: 0.9rem; color: #888; font-weight: bold; margin-top: 5px;">calculating...</div>
    </div>

    <div class="card" style="text-align: left;">
        <div style="font-size: 1.1rem; font-weight: bold; color: #1e3a8a; margin-bottom: 15px; text-align: center; letter-spacing: -0.5px;">⚡ SoundBuddy Milestone</div>
        <div class="check-item"><input type="checkbox" id="p1" onchange="updateProject()"><label for="p1" class="check-label">Sound Buddy Sound Samples (+20%)</label></div>
        <div class="check-item"><input type="checkbox" id="p2" onchange="updateProject()"><label for="p2" class="check-label">Clinical Trial (+20%)</label></div>
        <div class="check-item"><input type="checkbox" id="p3" onchange="updateProject()"><label for="p3" class="check-label">Ready for Regional Competition (+10%)</label></div>
        <div class="check-item"><input type="checkbox" id="p4" onchange="updateProject()"><label for="p4" class="check-label">Ready for DVSF (+30%)</label></div>
        <div class="check-item"><input type="checkbox" id="p5" onchange="updateProject()"><label for="p5" class="check-label">Ready for ISEF (+20%)</label></div>
    </div>

    <button class="reset-btn" onclick="resetScore(1494)">Admin: Reset to 1494</button>
</div>

<div id="prepModal" class="modal">
    <div class="modal-content">
        <h2 style="color: #1a73e8; margin-bottom: 10px; font-size: 1.2rem;">Daily Mission</h2>
        <p id="question-display" style="font-size: 1.1rem; line-height: 1.4; font-weight: 500;"></p>
        <div id="binary-choice" style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn btn-primary" style="flex:1;" onclick="handleBinary(true)">Yes</button>
            <button class="btn" style="flex:1; background:#f1f1f1;" onclick="handleBinary(false)">No</button>
        </div>
        <div id="number-choice" style="display:none;">
            <input type="number" id="unit-count" class="input-set" placeholder="How many?">
            <button class="btn btn-primary" onclick="handleNumber()">Next</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAoLonGkvQrPpNk5Rl8vJvR-eNg63xUPO4",
        authDomain: "road-to-the-victory-mason.firebaseapp.com",
        projectId: "road-to-the-victory-mason",
        storageBucket: "road-to-the-victory-mason.firebasestorage.app",
        messagingSenderId: "501843531403",
        appId: "1:501843531403:web:da9adcba51b12ad057e68e",
        databaseURL: "https://road-to-the-victory-mason-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let state = { score: 1494, history: [], lastUpdateDay: new Date().toDateString(), didCheckIn: false, project: [false,false,false,false,false] };
    let currentStep = 0;
    let answers = { mathM: false, elaM: false, newMath: 0, newEla: 0 };

    const questions = [
        { id: 'mathM', q: "Did you do math mastery challenge?", type: "binary" },
        { id: 'elaM', q: "Did you do ELA mastery challenge?", type: "binary" },
        { id: 'newMath', q: "How many new math unit did you do?", type: "number" },
        { id: 'newEla', q: "How many new ela unit did you do?", type: "number" }
    ];

    async function loadData() {
        const snapshot = await db.ref('mason_v153').once('value');
        if (snapshot.exists()) {
            state = snapshot.val();
            if(!state.history) state.history = [];
            if(!state.project) state.project = [false,false,false,false,false];
            checkDailyGap();
        } else {
            resetScore(1494, true);
        }
        updateUI();
    }

    function checkDailyGap() {
        const today = new Date().toDateString();
        if (today !== state.lastUpdateDay) {
            if (!state.didCheckIn) {
                state.score -= 40;
                recordHistory(-40);
            }
            state.lastUpdateDay = today;
            state.didCheckIn = false;
            saveData();
        }
    }

    function startPrep() {
        if (state.didCheckIn) return alert("Checked in already!");
        currentStep = 0;
        showStep();
        document.getElementById('prepModal').style.display = 'flex';
    }

    function showStep() {
        const item = questions[currentStep];
        document.getElementById('question-display').innerText = item.q;
        document.getElementById('binary-choice').style.display = item.type === "binary" ? "flex" : "none";
        document.getElementById('number-choice').style.display = item.type === "number" ? "block" : "none";
        if(item.type === "number") document.getElementById('unit-count').value = "";
    }

    function handleBinary(isYes) {
        answers[questions[currentStep].id] = isYes;
        currentStep++;
        if (currentStep < questions.length) showStep(); else finishCalc();
    }

    function handleNumber() {
        answers[questions[currentStep].id] = parseInt(document.getElementById('unit-count').value) || 0;
        currentStep++;
        if (currentStep < questions.length) showStep(); else finishCalc();
    }

    function finishCalc() {
        let change = 0;
        const mMath = answers.mathM;
        const mEla = answers.elaM;
        const nMath = answers.newMath;
        const nEla = answers.newEla;

        // v1.5.2 점수 로직 그대로 유지
        if (!mMath && !mEla && nMath === 0 && nEla === 0) {
            change = -40;
        } else if ((mMath && !mEla && nMath === 0 && nEla === 0) || (!mMath && mEla && nMath === 0 && nEla === 0)) {
            change = -20;
        } else if (mMath && mEla && nMath === 0 && nEla === 0) {
            change = 0;
        } else if (mMath && !mEla && nMath === 1 && nEla === 0) {
            change = 10;
        } else if (!mMath && mEla && nMath === 0 && nEla === 1) {
            change = 10;
        } else if (mMath && mEla && nMath === 1 && nEla === 0) {
            change = 30;
        } else if (mMath && mEla && nMath === 0 && nEla === 1) {
            change = 30;
        } else if (mMath && mEla && nMath >= 1 && nEla >= 1) {
            change = 40 + (Math.max(0, (nMath + nEla) - 2) * 10);
        }

        state.score += change;
        state.didCheckIn = true;
        recordHistory(change);
        saveData();
        document.getElementById('prepModal').style.display = 'none';
        alert(`Today's Change: ${change > 0 ? '+' : ''}${change}`);
    }

    function recordHistory(change) {
        const date = new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'});
        state.history.push({date: date, score: state.score});
        if(state.history.length > 10) state.history.shift();
    }

    function updateProject() {
        for(let i=0; i<5; i++) state.project[i] = document.getElementById(`p${i+1}`).checked;
        saveData();
    }

    function toggleGraph() {
        const container = document.getElementById('chartContainer');
        container.style.display = (container.style.display === 'none' || container.style.display === '') ? 'block' : 'none';
        if(container.style.display === 'block') renderChart();
    }

    let myChart = null;
    function renderChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: state.history.map(h => h.date),
                datasets: [{ label: 'SAT Score', data: state.history.map(h => h.score), borderColor: '#1a73e8', tension: 0.3, fill: true, backgroundColor: 'rgba(26, 115, 232, 0.1)' }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function resetScore(val, isInit=false) {
        if(!isInit && !confirm("Reset scores and projects?")) return;
        state = { score: val, history: [{date: 'Start', score: val}], lastUpdateDay: new Date().toDateString(), didCheckIn: false, project: [false,false,false,false,false] };
        saveData();
    }

    function saveData() {
        db.ref('mason_v153').set(state);
        updateUI();
    }

    function updateUI() {
        document.getElementById('sat-score').innerText = state.score;
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
        
        // Admission Chance 계산 (SAT 포인트 + 프로젝트 가중치 합산)
        let satPoints = state.score >= 1550 ? 50 : state.score > 1450 ? (state.score - 1450) * 0.5 : 0;
        
        let projPoints = 0;
        const weights = [20, 20, 10, 30, 20]; // 수정된 프로젝트 가중치 (합계 100)
        for(let i=0; i<5; i++) {
            const el = document.getElementById(`p${i+1}`);
            if(el) {
                el.checked = state.project[i];
                if(state.project[i]) projPoints += weights[i];
            }
        }

        // SAT 점수(최대 50) + 프로젝트(최대 100)를 합산하여 최종 100% 캡씌우기
        // 이제 프로젝트 성공 시 SAT 점수가 조금 낮아도 합격률이 대폭 올라갑니다.
        const total = Math.min(100, Math.round(satPoints + projPoints));
        document.getElementById('chance-percent').innerText = `${total}%`;
        document.getElementById('chance-level').innerText = total >= 85 ? "TOP TIER MATERIAL" : total >= 60 ? "STRONG CANDIDATE" : "KEEP WORKING";
    }

    window.onload = loadData;
</script>
</body>
</html>
