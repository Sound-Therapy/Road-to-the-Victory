<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT 1500 Tracker - Mason</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 450px; background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .header { color: #888; font-size: 0.9rem; margin-bottom: 10px; }
        .score-label { font-size: 1.1rem; color: #444; margin-top: 20px; }
        .score-value { font-size: 5rem; font-weight: 800; color: #1a73e8; margin: 5px 0; letter-spacing: -2px; }
        .btn { width: 100%; padding: 18px; margin: 10px 0; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #1a73e8; color: white; }
        .btn-secondary { background-color: #f8f9fa; color: #5f6368; border: 1px solid #dadce0; }
        .chart-container { margin-top: 30px; padding: 15px; background: #fff; border-radius: 15px; border: 1px solid #eee; display: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; }
        .question-text { font-size: 1.1rem; color: #202124; line-height: 1.5; margin-bottom: 25px; font-weight: 500; }
        .choice-btn { width: 48%; padding: 12px; border: 1px solid #dadce0; border-radius: 10px; background: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header" id="display-date">--</div>
    
    <div class="score-label">Current Estimated SAT Score</div>
    <div id="sat-score" class="score-value">1400</div>
    
    <button class="btn btn-primary" onclick="startPrep()">SAT Prep Start</button>
    <button class="btn btn-secondary" onclick="toggleHistory()">View History & Graph</button>

    <div id="history-section" class="chart-container">
        <canvas id="scoreChart"></canvas>
    </div>
</div>

<div id="prepModal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title" style="color: #1a73e8; margin-top: 0;">Math</h2>
        <p id="question-display" class="question-text">Loading...</p>
        <div style="display: flex; justify-content: space-between;">
            <button class="choice-btn" onclick="handleChoice(true)">Yes</button>
            <button class="choice-btn" onclick="handleChoice(false)">No</button>
        </div>
    </div>
</div>

<script>
    // --- Official Data State ---
    let state = {
        score: 1400,
        lastUpdateDay: new Date().toDateString(), // Store as "Sun Mar 22 2026"
        didCheckIn: false,
        history: [{date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}), score: 1400}]
    };

    let chartInstance = null;

    function loadData() {
        const saved = localStorage.getItem('satTracker_Mason_Official');
        if (saved) {
            state = JSON.parse(saved);
            checkDailyGap();
        }
        updateUI();
    }

    function saveData() {
        localStorage.setItem('satTracker_Mason_Official', JSON.stringify(state));
    }

    // --- Daily Penalty Logic ---
    function checkDailyGap() {
        const todayStr = new Date().toDateString();
        
        if (todayStr !== state.lastUpdateDay) {
            const lastDate = new Date(state.lastUpdateDay);
            const todayDate = new Date(todayStr);
            const diffTime = Math.abs(todayDate - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays >= 1) {
                // If yesterday was skipped
                if (!state.didCheckIn) {
                    // Penalty for the first skipped day
                    state.score -= 4;
                    state.history.push({
                        date: lastDate.toLocaleDateString('en-US', {month:'short', day:'numeric'}),
                        score: state.score
                    });
                }
                
                // If multiple days were skipped
                if (diffDays > 1) {
                    for(let i=1; i < diffDays; i++) {
                        state.score -= 4;
                        let missingDate = new Date(lastDate);
                        missingDate.setDate(lastDate.getDate() + i);
                        state.history.push({
                            date: missingDate.toLocaleDateString('en-US', {month:'short', day:'numeric'}),
                            score: state.score
                        });
                    }
                }
            }

            state.lastUpdateDay = todayStr;
            state.didCheckIn = false;
            saveData();
            updateUI();
        }
    }

    let currentStep = 1; 
    let sessionPoints = 0;
    const questions = {
        1: "Did you complete your assigned Khan Academy Math units today?",
        2: "Did you transfer every mistake to your 'Error Note' and analyze the logic behind them?",
        3: "Did you complete your Khan Academy 'Reading & Writing' practice today?",
        4: "Did you review the 'Answer Explanations' and summarize the logic in your note?"
    };

    function startPrep() {
        if (state.didCheckIn) return alert("You've already updated your score for today!");
        currentStep = 1; sessionPoints = 0;
        showQuestion();
        document.getElementById('prepModal').style.display = 'flex';
    }

    function showQuestion() {
        document.getElementById('modal-title').innerText = currentStep <= 2 ? "Math" : "ELA";
        document.getElementById('question-display').innerText = questions[currentStep];
    }

    function handleChoice(isYes) {
        if (currentStep % 2 !== 0) {
            if (isYes) { sessionPoints += 1; currentStep++; } 
            else { currentStep += 2; }
        } else {
            if (isYes) sessionPoints += 1;
            currentStep++;
        }
        if (currentStep > 4) finishSession();
        else showQuestion();
    }

    function finishSession() {
        state.score += sessionPoints;
        state.didCheckIn = true;
        state.history.push({
            date: new Date().toLocaleDateString('en-US', {month:'short', day:'numeric'}),
            score: state.score
        });
        saveData();
        updateUI();
        document.getElementById('prepModal').style.display = 'none';
        if(chartInstance) updateChart();
    }

    function updateUI() {
        document.getElementById('sat-score').innerText = state.score;
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function toggleHistory() {
        const section = document.getElementById('history-section');
        section.style.display = (section.style.display === 'none' || section.style.display === '') ? 'block' : 'none';
        if (section.style.display === 'block') initChart();
    }

    function initChart() {
        const ctx = document.getElementById('scoreChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: state.history.map(h => h.date),
                datasets: [{
                    label: 'Score Trend',
                    data: state.history.map(h => h.score),
                    borderColor: '#e74c3c',
                    borderWidth: 3,
                    tension: 0.3,
                    fill: false
                }]
            },
            options: {
                scales: { y: { suggestedMin: 1350, suggestedMax: 1550 } }
            }
        });
    }

    window.onload = loadData;
    // Check for day change every hour while app might be open in a tab
    setInterval(checkDailyGap, 1000 * 60 * 60);
    // Top 20 Predictor Logic (v1.2.0)
function calculateTop20Score() {
    let score = 0;
    const currentSAT = parseFloat(localStorage.getItem('currentScore')) || 1400;

    // 1. Academic Foundation (Max 55+)
    if (currentSAT >= 1550) score += 20;
    else if (currentSAT >= 1500) score += 15;

    const gpa = document.querySelector('input[name="gpa"]:checked')?.value;
    if (gpa === "3.9") score += 20;
    else if (gpa === "3.7") score += 15;

    const apCount = parseInt(document.getElementById('ap-count').value) || 0;
    score += (apCount * 2.5);

    // 2. Passion Projects (Max 80)
    score += parseInt(document.querySelector('input[name="soundbuddy"]:checked')?.value || 0);
    score += parseInt(document.querySelector('input[name="jazz"]:checked')?.value || 0);

    // 3. Human Network & Story (Max 70)
    score += parseInt(document.querySelector('input[name="essay"]:checked')?.value || 0);
    score += parseInt(document.querySelector('input[name="recs"]:checked')?.value || 0);

    displayResult(score);
}

function displayResult(totalScore) {
    let rank = "";
    let message = "";

    if (totalScore >= 180) {
        rank = "THE CHOSEN ONE";
        message = "The universities don't choose you; YOU choose the university.";
    } else if (totalScore >= 150) {
        rank = "IVY LEAGUE TIER";
        message = "Highly competitive. One more 'National' hook will lock your seat.";
    } else if (totalScore >= 100) {
        rank = "COMPETITIVE BLUE";
        message = "Solid standing, but you need a stronger 'Hook' to stand out.";
    } else {
        rank = "THE GROUNDWORK";
        message = "Focus on your SAT (1550+) and GPA (3.9+) first.";
    }

    document.getElementById('result-area').innerHTML = `
        <h3>Total Score: ${totalScore}</h3>
        <h2 style="color: #ffd700;">${rank}</h2>
        <p>${message}</p>
    `;
}
</script>
</body>
</html>
